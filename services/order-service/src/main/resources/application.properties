spring.application.name=order-service
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:proba123}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

management.endpoints.web.exposure.include=health,info,metrics

clients.restaurant.url=${RESTAURANT_SERVICE_URL:http://localhost:8082}
clients.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8083}
clients.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
clients.delivery.url=${DELIVERY_SERVICE_URL:http://localhost:8085}
