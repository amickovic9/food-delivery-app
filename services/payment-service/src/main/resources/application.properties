spring.application.name=payment-service
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:proba123}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

management.endpoints.web.exposure.include=health,info,metrics

app.payment.latency-min-ms=${PAYMENT_LATENCY_MIN_MS:40}
app.payment.latency-max-ms=${PAYMENT_LATENCY_MAX_MS:160}
app.payment.failure-rate=${PAYMENT_FAILURE_RATE:0.03}
