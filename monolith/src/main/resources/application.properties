spring.application.name=food-delivery-monolith

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_delivery?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:proba123}

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

app.security.enabled=${SECURITY_ENABLED:true}
app.seed.enabled=${SEED_ENABLED:true}
app.jwt.secret=${JWT_SECRET:fB7vP9rTqZ2mX1wCkL8sV4dHj6nQ3yRe}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.payment.latency-min-ms=${PAYMENT_LATENCY_MIN_MS:40}
app.payment.latency-max-ms=${PAYMENT_LATENCY_MAX_MS:160}
app.payment.failure-rate=${PAYMENT_FAILURE_RATE:0.03}

app.notification.latency-ms=${NOTIFICATION_LATENCY_MS:5}
